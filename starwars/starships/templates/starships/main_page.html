{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main page</title>

    {% comment %} css {% endcomment %}
    <link rel="stylesheet" href="{% static 'starships/css/main_page.css' %}">

    {% comment %} logo {% endcomment %}
    <link rel="icon" href="{% static 'starships/img/logo.jpg' %}"> 
</head>
<body>
    {% comment %} side menu {% endcomment %}
    <aside>
        <span class="aside_title">starships list</span>
        <ul>
            {% for starship in starships_list %}
                <a href="{% url 'starship' forloop.counter0 %}">
                    {{ starship.name }}
                </a>
                <br>
            {% endfor %}
        </ul>
    </aside>

    <main>

        <img src="{% static 'starships/img/starwars.svg' %}" alt="aside">

    </main>

</body>
</html>
